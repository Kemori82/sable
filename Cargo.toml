[package]
name = "sable"
version = "1.0.2"
edition = "2021"
description = "Sable: AI-text detector, humanizer and writer that runs on your own computer"
publish = false

[[bin]]
name = "Sable"
path = "src/main.rs"

[dependencies]
llama-cpp-sys-2 = { version = "0.1.161", features = ["vulkan"] }
ort = { version = "2.0.0-rc.15", features = ["directml", "half"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
fancy-regex = "0.14"

regex = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.9"
wry = "0.53"
tao = "0.34"
anyhow = "1"
half = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Console", "Win32_Graphics_Dwm"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
